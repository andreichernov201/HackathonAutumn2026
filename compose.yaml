services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      REGULA_DATA_DIR: /data
      REGULA_SESSION_SECRET: ${REGULA_SESSION_SECRET:?set REGULA_SESSION_SECRET}
      REGULA_ENV: ${REGULA_ENV:-development}
      REGULA_SECURE_COOKIE: ${REGULA_SECURE_COOKIE:-0}
      REGULA_KNOWLEDGE_ADMIN_TOKEN: ${REGULA_KNOWLEDGE_ADMIN_TOKEN:-}
      REGULA_IMPORT_CASE_CORPUS: ${REGULA_IMPORT_CASE_CORPUS:-1}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_THINKING: ${AI_THINKING:-1}
      AI_MAX_TOOL_STEPS: ${AI_MAX_TOOL_STEPS:-16}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-90}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_MAX_MODEL_CALLS: ${AI_MAX_MODEL_CALLS:-12}
      AI_MAX_TOTAL_TOKENS: ${AI_MAX_TOTAL_TOKENS:-80000}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-100000}
      AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-30}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://127.0.0.1:8001/v1}
      QWEN_MODEL: ${QWEN_MODEL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    volumes:
      - regula_data:/data
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  regula_data:

