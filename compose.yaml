services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      REGULA_DATA_DIR: /data
      REGULA_SESSION_SECRET: ${REGULA_SESSION_SECRET:?set REGULA_SESSION_SECRET}
      REGULA_ENV: ${REGULA_ENV:-development}
      REGULA_SECURE_COOKIE: ${REGULA_SECURE_COOKIE:-0}
      REGULA_KNOWLEDGE_ADMIN_TOKEN: ${REGULA_KNOWLEDGE_ADMIN_TOKEN:-}
      REGULA_IMPORT_CASE_CORPUS: ${REGULA_IMPORT_CASE_CORPUS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    volumes:
      - regula_data:/data
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  regula_data:

