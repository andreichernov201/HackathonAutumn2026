name: ${REGULA_PROJECT:-regula}

services:
  api:
    image: ${REGULA_API_IMAGE:?pin api image by digest}
    environment:
      REGULA_ENV: ${REGULA_ENV:-production}
      REGULA_SECURE_COOKIE: ${REGULA_SECURE_COOKIE:-1}
      REGULA_SESSION_SECRET: ${REGULA_SESSION_SECRET:?required}
      REGULA_KNOWLEDGE_ADMIN_TOKEN: ${REGULA_KNOWLEDGE_ADMIN_TOKEN:-}
      REGULA_IMPORT_CASE_CORPUS: ${REGULA_IMPORT_CASE_CORPUS:-1}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_THINKING: ${AI_THINKING:-1}
      AI_MAX_TOOL_STEPS: ${AI_MAX_TOOL_STEPS:-16}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-90}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_MAX_MODEL_CALLS: ${AI_MAX_MODEL_CALLS:-12}
      AI_MAX_TOTAL_TOKENS: ${AI_MAX_TOTAL_TOKENS:-80000}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-100000}
      AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-30}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://127.0.0.1:8001/v1}
      QWEN_MODEL: ${QWEN_MODEL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      REGULA_DATA_DIR: /data
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 4
    mem_limit: 1536m
    cpus: 1.5
    restart: unless-stopped
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    image: ${REGULA_WEB_IMAGE:?pin web image by digest}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 4
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging: *logs

volumes:
  data:
    external: true
    name: ${REGULA_DATA_VOLUME:?set stable existing or newly created volume name}
